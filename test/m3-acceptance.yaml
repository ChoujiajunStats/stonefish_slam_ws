version: m3-v4
scope: Known free visual fixture; local odom waypoint navigation, no obstacle avoidance
defaults:
  initial_pose: ENU (0,0,-2), roll/pitch 0, yaw90 unless specified
  recording: state
  cleanup: finite launch, manifest-owned PID/container only
  evidence: m3-samples.jsonl, m3-events.jsonl, mission-events.jsonl, bag, metrics,
    native feedback
  statistics: full estimate window; waypoint truth error at every declared arrival
  startup_timeout_sec: 45.0
  goal_coordinates: mission_start relative at acceptance; x/y/z m, yaw rad
thresholds:
  estimate_position_rmse_m: 0.15
  estimate_velocity_rmse_m_s: 0.05
  true_waypoint_error_m: 0.15
  terminal_neutral_sec: 0.5
  true_waypoint_yaw_rad: 0.15
  roll_pitch_error_rmse_deg: 3.0
  control_request_age_p95_sec: 0.15
safety:
  true_enu_depth_m:
  - -4.5
  - -0.3
  true_horizontal_abs_m: 2.0
  roll_pitch_peak_deg: 25.0
