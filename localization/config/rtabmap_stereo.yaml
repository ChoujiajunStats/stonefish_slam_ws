# External OpenVINS odometry; stereo is already rectified by construction.
subscribe_stereo: true
subscribe_depth: false
subscribe_rgb: false
subscribe_odom_info: false
approx_sync: true
approx_sync_max_interval: 0.03
topic_queue_size: 10
sync_queue_size: 20
qos: 2
qos_camera_info: 2
qos_odom: 1
publish_tf: true
wait_for_transform: 0.1
Rtabmap/DetectionRate: '2.0'
Rtabmap/TimeThr: '0'
Mem/IncrementalMemory: 'true'
Mem/STMSize: '10'
RGBD/LinearUpdate: '0.08'
RGBD/AngularUpdate: '0.04'
RGBD/ProximityBySpace: 'true'
Reg/Strategy: '0'
Vis/MinInliers: '15'
Grid/Sensor: '1'
Grid/3D: 'true'
Grid/RangeMin: '0.3'
Grid/RangeMax: '8.0'
Grid/CellSize: '0.06'
Grid/NormalsSegmentation: 'false'
Grid/MaxGroundHeight: '0.06'
Grid/DepthDecimation: '4'
cloud_output_voxelized: true
map_always_update: false
